# Based on https://github.com/jagodevreede/semver-check/blob/c9353fa86eb9ae8f6b309057748672a6c1e0f435/.github/workflows/release.yml
# From https://foojay.io/today/how-to-publish-a-java-maven-project-to-maven-central-using-jreleaser-and-github-actions-2025-guide/
# If this doesn't work, try https://jreleaser.org/guide/latest/continuous-integration/github-actions.html
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
      nextVersion:
        description: 'Next version after release (-SNAPSHOT will be added automatically)'
        required: true

jobs:
  build:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Set up JDK 25
        # Release artifacts must be built on JDK 25+ so the JEP 238
        # META-INF/versions/25 entries (Java 25 parser activation) are
        # compiled into the codebase-graph-builder jar; the jdk25-multi-release
        # build profile is inactive on older build JDKs.
        uses: actions/setup-java@v3
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Set release version
        # Gradle plugin version sync: refactor-first-gradle-plugin/gradle.properties
        # (refactorFirstVersion) must be bumped to the same version in the commits
        # produced by this workflow. The Gradle plugin is published separately
        # (./gradlew publishPlugins, maintainer-only) and must only be published
        # AFTER this workflow has landed the matching `report` artifact on Maven
        # Central — the plugin jar is thin and resolves `report` at runtime.
        run: |
          mvn --no-transfer-progress --batch-mode versions:set -DnewVersion=${{ github.event.inputs.version }}
          sed -i "s/^refactorFirstVersion=.*/refactorFirstVersion=${{ github.event.inputs.version }}/" refactor-first-gradle-plugin/gradle.properties

      - name: Commit & Push changes
        uses: actions-js/push@master
        with:
          github_token: ${{ secrets.JRELEASER_GITHUB_TOKEN }}
          message: "build: Releasing version ${{ github.event.inputs.version }}"

      - name: Stage release
        run: mvn --no-transfer-progress --batch-mode -Ppublish clean deploy -DaltDeploymentRepository=local::default::file://`pwd`/target/staging-deploy

      - name: Verify multi-release jar contains Java 25 entries
        # Release guard: published jars must carry the JEP 238 versioned
        # factory so JDK 25 users actually get the Java 25 parser.
        run: |
          jar=$(ls codebase-graph-builder/target/codebase-graph-builder-*.jar | grep -v -e sources -e javadoc | head -1)
          unzip -l "$jar" | grep "META-INF/versions/25/org/hjug/graphbuilder/graphbuilder/Java25ParserFactory.class" >/dev/null \
            || { echo "FATAL: $jar is missing META-INF/versions/25 entries"; exit 1; }
          unzip -p "$jar" META-INF/MANIFEST.MF | grep -q "Multi-Release: true" \
            || { echo "FATAL: $jar manifest lacks 'Multi-Release: true'"; exit 1; }

      - name: Run JReleaser
        uses: jreleaser/release-action@v2
        with:
          setup-java: false
          version: 1.20.0
        env:
          JRELEASER_PROJECT_VERSION: ${{ github.event.inputs.version }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.JRELEASER_GITHUB_TOKEN }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          JRELEASER_DEPLOY_MAVEN_MAVENCENTRAL_RELEASE_DEPLOY_USERNAME: ${{ secrets.JRELEASER_MAVENCENTRAL_SONATYPE_USERNAME }}
          JRELEASER_DEPLOY_MAVEN_MAVENCENTRAL_RELEASE_DEPLOY_PASSWORD: ${{ secrets.JRELEASER_MAVENCENTRAL_SONATYPE_PASSWORD }}

      - name: Set release version
        run: |
          mvn --no-transfer-progress --batch-mode versions:set -DnewVersion=${{ github.event.inputs.nextVersion }}-SNAPSHOT
          sed -i "s/^refactorFirstVersion=.*/refactorFirstVersion=${{ github.event.inputs.nextVersion }}-SNAPSHOT/" refactor-first-gradle-plugin/gradle.properties

      - name: Commit & Push changes
        uses: actions-js/push@master
        with:
          github_token: ${{ secrets.JRELEASER_GITHUB_TOKEN }}
          message: "build: Setting SNAPSHOT version ${{ github.event.inputs.nextVersion }}-SNAPSHOT"
          tags: false

      - name: JReleaser release output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jreleaser-release
          path: |
            out/jreleaser/trace.log
            out/jreleaser/output.properties