name: Report E2E

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate Fixture Reports
        run: mvn -B -pl report -am install -Dtest=SampleReportGenerationTest -DfailIfNoTests=false

      - name: Install Playwright Browsers
        run: |
          cd report/e2e
          npm install
          npx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: |
          cd report/e2e
          npx playwright test
