plugins {
    id 'java'
    id 'java-gradle-plugin'
    id 'maven-publish'
    id 'com.gradle.plugin-publish' version '2.2.1'
}

group = 'org.hjug.refactorfirst.plugin'
version = refactorFirstVersion

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    compileOnly gradleApi()
    implementation "org.hjug.refactorfirst.report:report:$refactorFirstVersion"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.eclipse.jgit:org.eclipse.jgit:7.7.0.202606012155-r'
    testImplementation gradleTestKit()
}

jar {
    manifest {
        attributes 'Implementation-Title': 'RefactorFirstPlugin',
                'Implementation-Version': version
    }
}

gradlePlugin {
    website = 'https://github.com/refactorfirst/RefactorFirst'
    vcsUrl = 'https://github.com/refactorfirst/RefactorFirst'
    plugins {
        refactorFirstPlugin {
            id = 'org.hjug.refactorfirst'
            displayName = 'RefactorFirst'
            description = 'Plugin that identifies God classes in a codebase and suggests which classes should be refactored first.'
            implementationClass = 'org.hjug.gradlereport.RefactorFirstPlugin'
            tags = ['refactoring', 'code-quality', 'static-analysis', 'god-class', 'cyclic-dependencies']
        }
    }
}

// Publishing to the Gradle Plugin Portal is a maintainer-only manual step:
// ./gradlew publishPlugins -Pgradle.publish.key=... -Pgradle.publish.secret=...
// The automatically created 'pluginMaven' publication (java-gradle-plugin + maven-publish)
// remains available for Maven Central consumers using classpath(...) in the buildscript block.

tasks.test {
    useJUnitPlatform()
}
